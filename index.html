<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>راش سیتی</title>
<meta name="description" content="RUSH CITY — یک دنیای سه‌بعدی آنلاین">
<link rel="icon" href="images/icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Vazirmatn';
    src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Vazirmatn';
    src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Vazirmatn';
    src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Black.woff2') format('woff2');
    font-weight: 900;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: #fff;
  }

  /* ===== CANVAS BACKGROUND ===== */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ===== GRID OVERLAY ===== */
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image:
      linear-gradient(rgba(255, 200, 0, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 200, 0, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    pointer-events: none;
  }

  /* ===== VIGNETTE ===== */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.85) 100%);
    pointer-events: none;
  }

  /* ===== MAIN ===== */
  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeDown 0.8s ease 0.2s forwards;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  }

  .brand-name {
    font-size: 16px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 3px;
  }

  .top-nav {
    display: flex;
    gap: 8px;
  }

  .nav-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.15);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffd700;
    text-decoration: none;
    font-size: 18px;
    transition: all 0.3s ease;
  }

  .nav-icon:hover {
    background: rgba(255, 215, 0, 0.1);
    border-color: rgba(255, 215, 0, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 215, 0, 0.2);
  }

  /* ===== CENTER ===== */
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  /* ===== HERO ICON ===== */
  .hero-icon {
    width: 130px;
    height: 130px;
    border-radius: 30px;
    margin-bottom: 30px;
    box-shadow:
      0 0 60px rgba(255, 215, 0, 0.5),
      0 0 120px rgba(255, 215, 0, 0.2),
      0 20px 60px rgba(0, 0, 0, 0.8);
    animation: heroFloat 4s ease-in-out infinite, heroFadeIn 1s ease 0.4s both;
    border: 2px solid rgba(255, 215, 0, 0.3);
  }

  @keyframes heroFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  @keyframes heroFadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ===== HERO TITLE ===== */
  .hero-title {
    font-size: clamp(56px, 14vw, 120px);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -2px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff 0%, #ffd700 50%, #ff8c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.4));
    animation: titleIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    direction: ltr;
  }

  @keyframes titleIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(20px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* ===== HERO SUBTITLE ===== */
  .hero-subtitle {
    font-size: clamp(11px, 3vw, 15px);
    font-weight: 700;
    letter-spacing: 12px;
    color: rgba(255, 215, 0, 0.8);
    margin-bottom: 50px;
    padding-right: 12px;
    animation: fadeUp 1s ease 0.8s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== CTA BUTTON ===== */
  .cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 20px 56px;
    font-family: inherit;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 900;
    color: #1a0a00;
    text-decoration: none;
    background: linear-gradient(180deg, #ffd700 0%, #ffb300 100%);
    border-radius: 100px;
    letter-spacing: 1px;
    box-shadow:
      0 0 40px rgba(255, 215, 0, 0.6),
      0 0 80px rgba(255, 215, 0, 0.3),
      0 8px 0 #8a6a00,
      0 12px 30px rgba(0, 0, 0, 0.5),
      inset 0 2px 8px rgba(255, 255, 255, 0.6);
    transition: all 0.2s ease;
    animation: fadeUp 1s ease 1s both;
    overflow: hidden;
  }

  .cta::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
    transition: left 0.6s ease;
  }

  .cta:hover::before {
    left: 100%;
  }

  .cta:hover {
    transform: translateY(-4px);
    box-shadow:
      0 0 60px rgba(255, 215, 0, 0.8),
      0 0 120px rgba(255, 215, 0, 0.4),
      0 12px 0 #8a6a00,
      0 18px 40px rgba(0, 0, 0, 0.5),
      inset 0 2px 8px rgba(255, 255, 255, 0.6);
  }

  .cta:active {
    transform: translateY(4px);
    box-shadow:
      0 0 40px rgba(255, 215, 0, 0.6),
      0 4px 0 #8a6a00,
      0 6px 15px rgba(0, 0, 0, 0.5),
      inset 0 2px 8px rgba(255, 255, 255, 0.3);
  }

  .cta-icon {
    font-size: 22px;
    line-height: 1;
  }

  /* ===== BOTTOM BAR ===== */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #666;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.4s forwards;
  }

  .version {
    letter-spacing: 1px;
  }

  .version span {
    color: #ffd700;
    font-weight: 700;
  }

  .copyright {
    letter-spacing: 0.5px;
  }

  .dot-separator {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffd700;
    margin: 0 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
  }

  /* ===== FLOATING PARTICLES ===== */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    pointer-events: none;
    z-index: 3;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .hero-icon { width: 100px; height: 100px; border-radius: 24px; }
    .cta { padding: 16px 42px; }
    .top-bar { padding: 0; }
    .bottom-bar { font-size: 11px; flex-direction: column; gap: 8px; text-align: center; }
    .brand-logo { width: 36px; height: 36px; }
    .nav-icon { width: 38px; height: 38px; font-size: 16px; }
  }

  @media (max-height: 600px) {
    .hero-icon { width: 80px; height: 80px; margin-bottom: 15px; }
    .hero-subtitle { margin-bottom: 30px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="vignette"></div>

<div class="container">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand">
      <img src="images/icon.png" alt="Rush City" class="brand-logo">
      <span class="brand-name">RUSH CITY</span>
    </div>
    <div class="top-nav">
      <a href="mailto:hoseinheidari1029@gmail.com" class="nav-icon" title="تماس">✉</a>
      <a href="https://myket.ir/app/com.rushcity.game" class="nav-icon" title="مایکت">⬇</a>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <img src="images/icon.png" alt="Rush City" class="hero-icon">
    <h1 class="hero-title">RUSH CITY</h1>
    <p class="hero-subtitle">ماجراجویی آنلاین</p>
    <a href="https://myket.ir/app/com.rushcity.game" class="cta">
      <span class="cta-icon">▶</span>
      <span>شروع کن</span>
    </a>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="version">نسخه <span>۱.۰.۰</span></div>
    <div class="copyright">© ۲۰۲۶ Rush City</div>
  </div>

</div>

<script>
  // ===== PARTICLES =====
  const particleContainer = document.body;
  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = '100%';
    const duration = 8 + Math.random() * 8;
    const size = 1 + Math.random() * 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.opacity = 0.3 + Math.random() * 0.5;
    p.style.transition = `transform ${duration}s linear, opacity ${duration}s linear`;
    particleContainer.appendChild(p);

    requestAnimationFrame(() => {
      p.style.transform = `translateY(-${window.innerHeight + 100}px) translateX(${(Math.random() - 0.5) * 100}px)`;
      p.style.opacity = '0';
    });

    setTimeout(() => p.remove(), duration * 1000);
  }

  setInterval(spawnParticle, 400);
  for (let i = 0; i < 15; i++) {
    setTimeout(spawnParticle, i * 200);
  }

  // ===== CANVAS BACKGROUND (ستاره‌ها) =====
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  let stars = [];
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 8000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.5 + 0.2,
        speed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ستاره‌ها
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const pulse = Math.sin(time * s.speed + s.phase) * 0.3 + 0.7;
      const alpha = s.a * pulse;

      ctx.beginPath();
      ctx.arc(s.x + targetX * 20, s.y + targetY * 20, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
      ctx.fill();
    }

    // یک ستاره درخشان مرکزی
    const gradient = ctx.createRadialGradient(
      canvas.width / 2 + targetX * 30,
      canvas.height / 2 + targetY * 30,
      0,
      canvas.width / 2 + targetX * 30,
      canvas.height / 2 + targetY * 30,
      Math.min(canvas.width, canvas.height) * 0.5
    );
    gradient.addColorStop(0, `rgba(255, 215, 0, ${0.08 + Math.sin(time * 0.5) * 0.03})`);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  let startTime = performance.now();
  function loop(now) {
    const t = (now - startTime) / 1000;
    targetX += (mouseX - targetX) * 0.05;
    targetY += (mouseY - targetY) * 0.05;
    drawStars(t);
    requestAnimationFrame(loop);
  }

  // ===== MOUSE / TOUCH TRACKING =====
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) {
      mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
    }
  }, { passive: true });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
</script>

</body>
  </html>
